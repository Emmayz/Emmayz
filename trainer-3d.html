<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nike Air Max Plus × FIJI Water — 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a1628 0%, #0d2a4a 40%, #1a4a6e 100%);
      overflow: hidden;
      font-family: 'Helvetica Neue', sans-serif;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      padding: 12px 24px;
      z-index: 100;
    }
    #ui button {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 8px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    #ui button:hover { background: rgba(255,255,255,0.22); }
    #ui button.active { background: #4ab3e8; border-color: #4ab3e8; }
    #title {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      z-index: 100;
      pointer-events: none;
    }
    #title h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    #title p { font-size: 12px; color: #7ec8e3; letter-spacing: 3px; margin-top: 4px; }
    #hint {
      position: fixed;
      top: 28px;
      right: 28px;
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      line-height: 1.8;
      text-align: right;
      pointer-events: none;
    }
    #badge {
      position: fixed;
      bottom: 100px;
      right: 28px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      color: #fff;
      font-size: 11px;
      line-height: 2;
      pointer-events: none;
    }
    #badge .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div id="canvas-container"></div>

<div id="title">
  <h1>Nike Air Max Plus × FIJI Water</h1>
  <p>Hydration · Style · Island Energy</p>
</div>

<div id="hint">
  Drag to rotate<br>
  Scroll to zoom<br>
  Right-drag to pan
</div>

<div id="badge">
  <div><span class="dot" style="background:#4ab3e8"></span>Fiji Blue</div>
  <div><span class="dot" style="background:#7dd4e8"></span>Water Wave</div>
  <div><span class="dot" style="background:#f0f0f0"></span>White Foam</div>
  <div><span class="dot" style="background:#c8c8c8"></span>Metallic Silver</div>
  <div><span class="dot" style="background:#e8506a"></span>Hibiscus Pink</div>
</div>

<div id="ui">
  <button id="btn-rotate" class="active">Auto Rotate</button>
  <button id="btn-explode">Explode View</button>
  <button id="btn-side">Side View</button>
  <button id="btn-top">Top View</button>
  <button id="btn-heel">Heel View</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ─────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 100);
camera.position.set(4, 2.5, 5);
camera.lookAt(0, 0.4, 0);

// ─── Colors ───────────────────────────────────────────────────────────────────
const C = {
  fijiBlue:    0x2196c8,
  waterWave:   0x7dd4e8,
  deepBlue:    0x0d4a7a,
  whiteFoam:   0xf0f4f8,
  silver:      0xb8c8d8,
  outsole:     0x1a2a3a,
  hibiscus:    0xe83060,
  hibiscusDk:  0xc01840,
  petal:       0xf06080,
  yellow:      0xf5c842,
  airBubble:   0x90d8f0,
};

// ─── Lights ───────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
scene.add(key);

const fill = new THREE.DirectionalLight(0x90c8f0, 0.7);
fill.position.set(-4, 3, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x4ab3e8, 0.5);
rim.position.set(0, -1, -5);
scene.add(rim);

// ─── Helpers ─────────────────────────────────────────────────────────────────
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.rough ?? 0.6,
    metalness: opts.metal ?? 0,
    transparent: opts.alpha !== undefined,
    opacity: opts.alpha ?? 1,
    side: opts.side ?? THREE.FrontSide,
    ...opts.extra,
  });
}

function addTo(parent, mesh) { parent.add(mesh); return mesh; }

// ─── Ground plane ─────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a2040, roughness: 0.9, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// Subtle reflection ring
const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.8, 2.2, 64),
  new THREE.MeshStandardMaterial({
    color: 0x4ab3e8, transparent: true, opacity: 0.08,
    roughness: 0.1, metalness: 0.5, side: THREE.DoubleSide
  })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.001;
scene.add(ring);

// ─── Shoe Group ───────────────────────────────────────────────────────────────
const shoe = new THREE.Group();
shoe.position.y = 0.55;
scene.add(shoe);

// Helper: create a shape from points and extrude
function makeExtruded(shape, depth, color, opts = {}) {
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelSize: 0.025, bevelThickness: 0.015, bevelSegments: 4
  });
  const mesh = new THREE.Mesh(geo, mat(color, opts));
  mesh.castShadow = true;
  return mesh;
}

// ─── OUTSOLE ──────────────────────────────────────────────────────────────────
const outsoleShape = new THREE.Shape();
outsoleShape.moveTo(-1.7, -0.2);
outsoleShape.bezierCurveTo(-1.7, -0.45, -1.1, -0.52, -0.5, -0.5);
outsoleShape.bezierCurveTo( 0.5, -0.48,  1.3, -0.42,  1.7, -0.2);
outsoleShape.bezierCurveTo( 1.75, 0.0,   1.7,  0.15,  1.6,  0.2);
outsoleShape.bezierCurveTo( 1.0,  0.22,  0.0,  0.22, -0.8,  0.22);
outsoleShape.bezierCurveTo(-1.2,  0.22, -1.7,  0.15, -1.7, -0.2);

const outsole = makeExtruded(outsoleShape, 0.22, C.outsole, { rough: 0.95 });
outsole.rotation.x = Math.PI / 2;
outsole.position.set(0, -0.53, 0);
shoe.add(outsole);

// Outsole grooves
for (let i = -3; i <= 3; i++) {
  const groove = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.06, 0.45),
    mat(0x0d1a28, { rough: 1 })
  );
  groove.position.set(i * 0.25, -0.53, 0.08);
  shoe.add(groove);
}

// ─── MIDSOLE ─────────────────────────────────────────────────────────────────
const midsoleShape = new THREE.Shape();
midsoleShape.moveTo(-1.65, -0.18);
midsoleShape.bezierCurveTo(-1.65, -0.38, -1.0, -0.44,  -0.4, -0.42);
midsoleShape.bezierCurveTo( 0.5,  -0.40,  1.25, -0.34,  1.65, -0.18);
midsoleShape.bezierCurveTo( 1.68,  0.0,   1.6,   0.18,  1.5,  0.22);
midsoleShape.bezierCurveTo( 0.9,   0.28,  0.0,   0.28, -0.75, 0.28);
midsoleShape.bezierCurveTo(-1.1,   0.28, -1.65,  0.18, -1.65, -0.18);

const midsole = makeExtruded(midsoleShape, 0.28, C.whiteFoam, { rough: 0.75 });
midsole.rotation.x = Math.PI / 2;
midsole.position.set(0, -0.3, 0);
shoe.add(midsole);

// ─── AIR MAX BUBBLES ──────────────────────────────────────────────────────────
function airBubble(x, z, rx, ry, rz) {
  const geo = new THREE.SphereGeometry(0.18, 20, 16);
  geo.scale(1.4, 0.72, 0.9);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: C.airBubble, roughness: 0.05, metalness: 0.1,
    transparent: true, opacity: 0.72,
    envMapIntensity: 1.2,
  }));
  mesh.position.set(x, -0.2, z);
  mesh.rotation.set(rx ?? 0, ry ?? 0, rz ?? 0);
  mesh.castShadow = false;
  shoe.add(mesh);
  return mesh;
}

airBubble(-1.15, 0,  0, 0, 0.08);   // heel
airBubble(-0.45, 0,  0, 0, 0.04);   // mid-heel
airBubble( 0.35, 0,  0, 0, -0.04);  // mid-fore
airBubble( 1.05, 0,  0, 0, -0.08);  // toe

// Air window frames
[-1.15, -0.45, 0.35, 1.05].forEach((x, i) => {
  const frame = new THREE.Mesh(
    new THREE.TorusGeometry(0.18, 0.025, 8, 24),
    mat(C.whiteFoam, { rough: 0.5 })
  );
  frame.position.set(x, -0.2, 0.22);
  frame.scale.set(1.4, 0.72, 1);
  shoe.add(frame);
});

// ─── UPPER — main body ────────────────────────────────────────────────────────
// Build the upper using layered curved geometry
const upperShape = new THREE.Shape();
upperShape.moveTo(-1.6, 0.0);
upperShape.bezierCurveTo(-1.62, 0.25, -1.5, 0.55, -1.2, 0.78);
upperShape.bezierCurveTo(-0.9,  1.0,  -0.5, 1.12,  0.0, 1.18);
upperShape.bezierCurveTo( 0.5,  1.22,  0.9, 1.12,  1.3, 0.85);
upperShape.bezierCurveTo( 1.6,  0.62,  1.7, 0.35,  1.65, 0.0);
upperShape.bezierCurveTo( 1.0,  0.06,  0.0, 0.08, -0.75, 0.08);
upperShape.bezierCurveTo(-1.1,  0.08, -1.6, 0.04, -1.6, 0.0);

const upper = makeExtruded(upperShape, 0.38, C.fijiBlue, { rough: 0.45, metal: 0.05 });
upper.rotation.x = Math.PI / 2;
upper.position.set(0, -0.02, -0.04);
shoe.add(upper);

// Water wave overlay strips (lighter blue)
for (let i = 0; i < 6; i++) {
  const waveY = -0.05 + i * 0.2;
  const wave = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 3.1, 8),
    mat(C.waterWave, { rough: 0.35, alpha: 0.55, extra: { transparent: true } })
  );
  wave.rotation.z = Math.PI / 2;
  wave.rotation.x = (i % 2 === 0) ? 0.12 : -0.08;
  wave.position.set(0, waveY + 0.2, 0.22 - i * 0.02);
  shoe.add(wave);
}

// ─── TONGUE ───────────────────────────────────────────────────────────────────
const tongueGeo = new THREE.BoxGeometry(0.55, 0.72, 0.06);
tongueGeo.translate(0, 0.36, 0);
const tongue = new THREE.Mesh(tongueGeo, mat(C.waterWave, { rough: 0.5 }));
tongue.position.set(0.15, 0.42, 0.21);
tongue.rotation.x = -0.18;
tongue.castShadow = true;
shoe.add(tongue);

// Tongue FIJI badge
const badgeGeo = new THREE.BoxGeometry(0.22, 0.1, 0.025);
const badge3d = new THREE.Mesh(badgeGeo, mat(C.deepBlue, { rough: 0.3, metal: 0.4 }));
badge3d.position.set(0.15, 0.88, 0.26);
badge3d.rotation.x = -0.18;
shoe.add(badge3d);

// ─── COLLAR / ANKLE ───────────────────────────────────────────────────────────
const collarGeo = new THREE.TorusGeometry(0.48, 0.07, 10, 40, Math.PI * 1.3);
const collar = new THREE.Mesh(collarGeo, mat(C.deepBlue, { rough: 0.55 }));
collar.position.set(-0.55, 0.9, 0.0);
collar.rotation.y = -0.55;
collar.rotation.z = Math.PI * 0.08;
collar.castShadow = true;
shoe.add(collar);

// ─── HEEL COUNTER ─────────────────────────────────────────────────────────────
const heelGeo = new THREE.SphereGeometry(0.55, 16, 12, 0, Math.PI, 0, Math.PI * 0.6);
const heel = new THREE.Mesh(heelGeo, mat(C.deepBlue, { rough: 0.4, metal: 0.08 }));
heel.position.set(-1.35, 0.1, 0);
heel.rotation.y = Math.PI / 2;
heel.scale.set(0.7, 0.9, 1);
heel.castShadow = true;
shoe.add(heel);

// Heel TN badge
const tnBadge = new THREE.Mesh(
  new THREE.CircleGeometry(0.13, 20),
  mat(C.yellow, { rough: 0.3, metal: 0.6 })
);
tnBadge.position.set(-1.65, 0.55, 0.0);
tnBadge.rotation.y = Math.PI / 2;
shoe.add(tnBadge);

// TN text plane (simple gold disk)
const tnInner = new THREE.Mesh(
  new THREE.CircleGeometry(0.09, 20),
  mat(C.deepBlue, { rough: 0.4 })
);
tnInner.position.set(-1.652, 0.55, 0.0);
tnInner.rotation.y = Math.PI / 2;
shoe.add(tnInner);

// ─── HEEL TAB ─────────────────────────────────────────────────────────────────
const tabGeo = new THREE.BoxGeometry(0.06, 0.28, 0.18);
const tab = new THREE.Mesh(tabGeo, mat(C.fijiBlue, { rough: 0.5 }));
tab.position.set(-1.68, 0.85, 0);
shoe.add(tab);

// ─── NIKE SWOOSH ─────────────────────────────────────────────────────────────
// Build swoosh as a custom curve-based shape
const swooshCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.6,  0.0,  0.235),
  new THREE.Vector3( 0.2,  0.18, 0.235),
  new THREE.Vector3(-0.3,  0.34, 0.235),
  new THREE.Vector3(-0.85, 0.28, 0.235),
  new THREE.Vector3(-1.1,  0.12, 0.235),
]);

const swooshPoints = swooshCurve.getPoints(40);
const swooshShape = new THREE.Shape();
// top edge
swooshShape.moveTo( 0.6,  0.0);
swooshShape.bezierCurveTo( 0.3,  0.25, -0.2,  0.45, -0.75, 0.42);
swooshShape.bezierCurveTo(-1.0,  0.4,  -1.15, 0.28, -1.1,  0.12);
// bottom edge
swooshShape.bezierCurveTo(-1.0,  0.0,  -0.8,  0.12, -0.5,  0.18);
swooshShape.bezierCurveTo(-0.1,  0.24,  0.3,  0.12,  0.6,  0.0);

const swooshGeo = new THREE.ShapeGeometry(swooshShape);
const swoosh = new THREE.Mesh(swooshGeo, mat(C.silver, { rough: 0.2, metal: 0.8 }));
swoosh.position.set(0.0, 0.18, 0.237);
swoosh.scale.set(0.88, 0.88, 1);
shoe.add(swoosh);

// Swoosh on other side (mirrored)
const swoosh2 = swoosh.clone();
swoosh2.position.set(0.0, 0.18, -0.24);
swoosh2.rotation.y = Math.PI;
shoe.add(swoosh2);

// ─── LACES ────────────────────────────────────────────────────────────────────
const laceMat = mat(C.whiteFoam, { rough: 0.8 });
// Lace eyelets
for (let i = 0; i < 7; i++) {
  const laceX = -0.5 + i * 0.22;
  [-0.12, 0.12].forEach(z => {
    const eyelet = new THREE.Mesh(
      new THREE.TorusGeometry(0.03, 0.012, 6, 12),
      mat(C.silver, { rough: 0.3, metal: 0.7 })
    );
    eyelet.position.set(laceX, 0.68, z);
    eyelet.rotation.x = Math.PI / 2;
    shoe.add(eyelet);
  });
  // Lace cross
  if (i < 6) {
    const lace = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.012, 0.26, 6),
      laceMat
    );
    lace.rotation.z = Math.PI / 2;
    lace.rotation.x = (i % 2 === 0) ? 0.15 : -0.15;
    lace.position.set(laceX + 0.11, 0.68 + (i % 2 === 0 ? 0.025 : -0.025), 0);
    shoe.add(lace);
  }
}
// Lace runs down tongue
for (let i = 0; i < 7; i++) {
  [-0.12, 0.12].forEach(z => {
    const run = new THREE.Mesh(
      new THREE.CylinderGeometry(0.01, 0.01, 0.22, 6),
      laceMat
    );
    run.position.set(-0.5 + i * 0.22, 0.58, z * 0.95);
    run.rotation.z = Math.PI / 2;
    shoe.add(run);
  });
}

// ─── HIBISCUS FLOWERS ─────────────────────────────────────────────────────────
function hibiscus(px, py, pz, ry, scale = 1) {
  const g = new THREE.Group();
  const petalColors = [C.hibiscus, C.hibiscusDk, C.petal, C.hibiscus, C.hibiscusDk];

  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const pShape = new THREE.Shape();
    pShape.moveTo(0, 0);
    pShape.bezierCurveTo(-0.07, 0.05, -0.09, 0.14, 0, 0.22);
    pShape.bezierCurveTo( 0.09, 0.14,  0.07, 0.05, 0, 0);

    const pGeo = new THREE.ShapeGeometry(pShape);
    const petal = new THREE.Mesh(pGeo, mat(petalColors[i], { rough: 0.55, metal: 0.05, alpha: 0.92, extra: { transparent: true } }));
    petal.rotation.z = angle;
    petal.position.set(
      Math.cos(angle) * 0.08,
      Math.sin(angle) * 0.08,
      0
    );
    g.add(petal);
  }

  // Center
  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 10, 8),
    mat(C.yellow, { rough: 0.4 })
  );
  g.add(center);

  // Stamens (small yellow dots)
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(0.018, 6, 4),
      mat(C.yellow, { rough: 0.3 })
    );
    s.position.set(Math.cos(a) * 0.04, Math.sin(a) * 0.04, 0.04);
    g.add(s);
  }

  g.scale.setScalar(scale);
  g.position.set(px, py, pz);
  g.rotation.y = ry;
  shoe.add(g);
  return g;
}

// Hibiscus on side of shoe
hibiscus(-0.9, 0.52, 0.26, 0, 1.0);   // left side front
hibiscus(-1.3, 0.62, 0.0,  Math.PI/2, 0.8);  // heel side
hibiscus( 0.4, 0.42, 0.26, 0, 0.7);   // mid side

// ─── SUBTLE PARTICLES (water drops) ───────────────────────────────────────────
const particleGeo = new THREE.BufferGeometry();
const particleCount = 180;
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 8;
  positions[i * 3 + 1] = Math.random() * 4 - 0.5;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x90d8f4, size: 0.04, transparent: true, opacity: 0.45
});
scene.add(new THREE.Points(particleGeo, particleMat));

// ─── ORBIT CONTROLS (manual implementation) ───────────────────────────────────
let isDragging = false, isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.6, phi: 1.1, radius: 7 };
let target = new THREE.Vector3(0, 0.4, 0);
let autoRotate = true;
let exploded = false;
let explodeT = 0;

const originalPositions = new Map();

function savePositions() {
  shoe.children.forEach((child, i) => {
    originalPositions.set(i, child.position.clone());
  });
}
savePositions();

function setExplode(on) {
  exploded = on;
}

function updateCamera() {
  camera.position.x = target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi);
  camera.position.z = target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(target);
}

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true;
  isRightDrag = e.button === 2;
  prevMouse = { x: e.clientX, y: e.clientY };
  autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
});

renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  prevMouse = { x: e.clientX, y: e.clientY };
  if (isRightDrag) {
    target.x -= dx * 0.004;
    target.y += dy * 0.004;
  } else {
    spherical.theta -= dx * 0.007;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.007));
  }
  updateCamera();
});

renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

renderer.domElement.addEventListener('wheel', e => {
  spherical.radius = Math.max(2, Math.min(14, spherical.radius + e.deltaY * 0.01));
  updateCamera();
});

// Touch support
let lastTouch = null;
renderer.domElement.addEventListener('touchstart', e => {
  lastTouch = e.touches[0];
  autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
});
renderer.domElement.addEventListener('touchmove', e => {
  if (!lastTouch) return;
  const t = e.touches[0];
  const dx = t.clientX - lastTouch.clientX;
  const dy = t.clientY - lastTouch.clientY;
  spherical.theta -= dx * 0.008;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.008));
  lastTouch = t;
  updateCamera();
  e.preventDefault();
}, { passive: false });

// ─── UI Buttons ───────────────────────────────────────────────────────────────
function smoothLookAt(theta, phi, radius, dur = 1200) {
  const start = { theta: spherical.theta, phi: spherical.phi, radius: spherical.radius };
  const end = { theta, phi, radius };
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    spherical.theta = start.theta + (end.theta - start.theta) * ease;
    spherical.phi   = start.phi   + (end.phi   - start.phi)   * ease;
    spherical.radius= start.radius+ (end.radius - start.radius) * ease;
    updateCamera();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

document.getElementById('btn-rotate').addEventListener('click', function() {
  autoRotate = !autoRotate;
  this.classList.toggle('active', autoRotate);
});

document.getElementById('btn-explode').addEventListener('click', function() {
  exploded = !exploded;
  this.classList.toggle('active', exploded);
  this.textContent = exploded ? 'Collapse' : 'Explode View';
});

document.getElementById('btn-side').addEventListener('click', () => {
  smoothLookAt(Math.PI / 2, Math.PI / 2.2, 6.5);
  autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
});

document.getElementById('btn-top').addEventListener('click', () => {
  smoothLookAt(0.6, 0.28, 6);
  autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
});

document.getElementById('btn-heel').addEventListener('click', () => {
  smoothLookAt(-Math.PI + 0.3, Math.PI / 2.1, 6.5);
  autoRotate = false;
  document.getElementById('btn-rotate').classList.remove('active');
});

// ─── Animation Loop ───────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  time += delta;

  if (autoRotate) {
    spherical.theta += delta * 0.35;
    updateCamera();
  }

  // Explode animation
  if (exploded) {
    explodeT = Math.min(1, explodeT + delta * 1.5);
  } else {
    explodeT = Math.max(0, explodeT - delta * 1.5);
  }
  const ease = explodeT < 0.5 ? 2 * explodeT * explodeT : -1 + (4 - 2 * explodeT) * explodeT;

  shoe.children.forEach((child, i) => {
    const orig = originalPositions.get(i);
    if (!orig) return;
    const spread = i * 0.08;
    child.position.y = orig.y + Math.sin(i * 1.3) * spread * ease * 0.5;
    child.position.x = orig.x + Math.cos(i * 0.9) * spread * ease * 0.3;
    child.position.z = orig.z + Math.sin(i * 0.5) * spread * ease * 0.2;
  });

  // Animate hibiscus petals gently
  const hibStart = shoe.children.length - 3;
  shoe.children.forEach((child, i) => {
    if (child.isGroup) {
      child.rotation.z = Math.sin(time * 0.8 + i) * 0.04;
    }
  });

  // Animate water particles
  const posArr = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    posArr[i * 3 + 1] -= delta * 0.12;
    if (posArr[i * 3 + 1] < -0.5) posArr[i * 3 + 1] = 4;
  }
  particleGeo.attributes.position.needsUpdate = true;

  // Subtle shoe float
  shoe.position.y = 0.55 + Math.sin(time * 0.9) * 0.04;

  renderer.render(scene, camera);
}

updateCamera();
animate();

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
